<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client-side URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script>
</head>

<body>
    <form name="main">
        <h1>Client-Side<br>URL Shortener</h1>
        <!-- URL -->
        <span>
            <label for="url-input">URL</label>
            <input id="url-input" type="url" pattern="^https?:.*" placeholder="https://example.com/page" required autofocus spellcheck="false">
            <button type="button" aria-label="Paste URL" class="paste"><i class="ph-fill ph-clipboard"></i></button>
        </span>
        <!-- Short URL -->
        <span>
            <label for="short-url-output">Short URL</label>
            <output id="short-url-output" aria-live="polite" aria-placeholder="Your short URL will appear here."></output>
            <button type="button" aria-label="Copy short URL" class="copy"><i class="ph-fill ph-copy"></i></button>
        </span>
        <button type="reset">↻</button>
        <button type="submit" disabled>✓</button>
    </form>
    <dialog>
        <form method="dialog">
            <button>×</button>
        </form>
        <p role="status" aria-live="polite"></p>
    </dialog>
</body>

</html>
